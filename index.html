<td>

  <input
    type="text"
    class="percentual"
    inputmode="decimal"
    placeholder="Ex.: 13,94"
    value="${percentualContrato}"
    oninput="limitarPercentual(this)"
    onblur="formatarPercentual(this)"
  >

  <div class="ajuda">

    Informe o
    <strong>
      percentual de garantia
    </strong>
    disponibilizado para este contrato.

    <br><br>

    <strong>Exemplos:</strong>
    13,94 &nbsp; | &nbsp;
    14,08 &nbsp; | &nbsp;
    0,59 &nbsp; | &nbsp;
    6,36

    <br><br>

    Não informe a taxa de juros,
    o número de parcelas ou o percentual
    da parcela mensal.

  </div>

</td>
